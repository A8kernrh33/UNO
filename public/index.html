<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07110d"><title>UNO — Friends Table</title><style>
:root{--bg:#050807;--panel:#0d1411;--line:#ffffff18;--text:#f7faf8;--muted:#91a097;--red:#ff3e63;--yellow:#ffd33d;--green:#20d87d;--blue:#4b91ff;--shadow:0 30px 90px #0009}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#174f38,#09150f 38%,#030504 78%);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}.top{height:72px;padding:0 22px;border-bottom:1px solid var(--line);background:#050807b8;backdrop-filter:blur(18px);display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10}.brand{display:flex;gap:11px;align-items:center;font-weight:1000}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#ff5a74,#b8123b);font-style:italic;box-shadow:0 10px 30px #ff355a44}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.18em;text-transform:uppercase}.ghost,.primary,.action,.pick{border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:#ffffff09;font-weight:900}.primary{background:linear-gradient(135deg,#ff4065,#d91640);box-shadow:0 12px 30px #ff355a2d}.screen{min-height:calc(100vh - 72px);padding:28px 20px}.lobby{display:grid;place-items:center}.lobby-card{width:min(940px,100%);padding:38px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,#16211cd9,#080c0aeF);box-shadow:var(--shadow)}.eyebrow{color:var(--red);font-size:10px;font-weight:1000;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(52px,8vw,88px);line-height:.86;letter-spacing:-.08em;margin:10px 0 15px}.hero h1 span{color:var(--yellow)}.hero p{color:var(--muted);max-width:680px;line-height:1.7}.tabs{display:flex;gap:8px;margin:25px 0 15px}.tab{flex:1;padding:13px;border:1px solid var(--line);border-radius:13px;background:#ffffff07;font-weight:900}.tab.active{background:#f4f7f5;color:#07100c}.form{display:grid;gap:12px}.input{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);outline:0;background:#0004;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{font-size:11px;color:#728078;line-height:1.55}.room{display:grid;grid-template-columns:1fr 1.3fr;gap:14px;margin-top:20px}.mini{padding:18px;border:1px solid var(--line);border-radius:20px;background:#ffffff05}.mini h3{font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin:0 0 12px}.code{font-size:34px;font-weight:1000;letter-spacing:.12em;margin-bottom:10px}.players{display:grid;gap:7px}.player{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;background:#ffffff06}.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#2b3a31,#141b17);font-weight:1000}.player b{font-size:13px}.tag{margin-left:auto;color:var(--muted);font-size:10px}.ready{color:var(--green);font-weight:1000}.game{max-width:1500px;margin:auto;display:grid;grid-template-columns:230px minmax(0,1fr) 260px;gap:16px;height:calc(100vh - 128px)}.panel{border:1px solid var(--line);background:#050b08a8;backdrop-filter:blur(16px);border-radius:22px;box-shadow:0 18px 55px #0005}.side,.right{padding:15px;overflow:auto}.label{font-size:10px;color:#7e8b84;letter-spacing:.15em;text-transform:uppercase;font-weight:1000;margin:4px 3px 10px}.p{display:flex;gap:9px;align-items:center;padding:10px;border-radius:14px;margin-bottom:6px}.p.active{background:#ff355a18;border:1px solid #ff355a42}.count{margin-left:auto;color:#aab5af;font-size:10px;font-weight:900}.table{position:relative;overflow:hidden;border-radius:30px;border:1px solid #ffffff18;background:radial-gradient(circle at 50% 42%,#157346,#0c432d 43%,#082519 80%);box-shadow:inset 0 0 130px #0003,0 28px 90px #0007}.table:before{content:"";position:absolute;inset:18px;border:1px solid #ffffff0d;border-radius:25px}.turn{position:absolute;top:17px;left:50%;transform:translateX(-50%);z-index:5;padding:9px 15px;border:1px solid #ffffff18;background:#0006;backdrop-filter:blur(14px);border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}.center{position:absolute;inset:70px 0 205px;display:grid;place-items:center}.piles{display:flex;gap:38px;align-items:center}.caption{font-size:9px;color:#ffffff99;letter-spacing:.15em;text-transform:uppercase;text-align:center;margin-bottom:8px;font-weight:1000}.stack{position:relative;width:96px;height:140px}.card{width:96px;height:140px;border-radius:15px;position:absolute;inset:0;display:grid;place-items:center;border:2px solid #ffffffc7;box-shadow:0 14px 28px #0005;overflow:hidden;font-weight:1000;user-select:none}.card:before{content:"";position:absolute;inset:18px 12px;border:2px solid #ffffff80;border-radius:50%;transform:rotate(-25deg)}.card .main{z-index:2;font-size:35px;transform:rotate(-10deg);text-shadow:1px 2px #0003}.corner{position:absolute;z-index:3;font-size:12px;top:7px;left:8px}.corner:last-child{top:auto;left:auto;right:8px;bottom:7px;transform:rotate(180deg)}.red{background:linear-gradient(145deg,#ff526c,#d61c3d)}.yellow{background:linear-gradient(145deg,#ffdc63,#e8ac19);color:#201803}.green{background:linear-gradient(145deg,#39e69a,#09a866)}.blue{background:linear-gradient(145deg,#61a8ff,#2469dd)}.wild{background:conic-gradient(#ef3e4e 0 25%,#f5c52f 25% 50%,#22d57b 50% 75%,#4b8dff 75%)}.wild:after{content:"";position:absolute;inset:29px 20px;border-radius:50%;background:#11151d;z-index:1}.wild .main{z-index:3;color:#fff;font-size:28px}.stack .card:nth-child(1){transform:translate(6px,4px) rotate(4deg)}.stack .card.top{z-index:4;transform:none}.color{margin-top:10px;text-align:center;font-size:9px;text-transform:uppercase;color:#ffffffa8;letter-spacing:.1em}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;border:2px solid #fff9;vertical-align:middle}.hand-area{position:absolute;left:20px;right:20px;bottom:16px;z-index:10}.hand-head{display:flex;justify-content:space-between;margin:0 4px 7px}.hand-head b{font-size:12px}.hand-head span{font-size:10px;color:#ffffffaa}.hand{height:170px;display:flex;align-items:flex-end;justify-content:center;padding:0 22px;overflow-x:auto}.hand .card{position:relative;inset:auto;flex:0 0 78px;width:78px;height:114px;margin-left:-22px;cursor:pointer;transition:.16s;transform-origin:bottom center}.hand .card:first-child{margin-left:0}.hand .card:hover{transform:translateY(-22px)!important;z-index:20;filter:brightness(1.1)}.hand .card.disabled{filter:brightness(.5) grayscale(.4);cursor:not-allowed}.hand .card.disabled:hover{transform:none!important}.hand .main{font-size:25px}.hand .corner{font-size:10px}.actions{display:flex;justify-content:center;gap:8px}.action:disabled{opacity:.3;cursor:not-allowed}.action.primary{background:#f5f7f6;color:#07100c}.uno{background:linear-gradient(135deg,#ff4066,#ff8140);box-shadow:0 9px 26px #ff355a35}.right{display:flex;flex-direction:column;min-height:0}.feed{flex:1;overflow:auto}.event{padding:9px 0;border-bottom:1px solid #ffffff0b;font-size:10px;line-height:1.45;color:#b5c0ba}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.stat{padding:9px;border-radius:12px;background:#ffffff06}.stat small{display:block;color:#78847d;font-size:8px;text-transform:uppercase}.stat b{display:block;font-size:16px;margin-top:2px}.modal{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px}.box{width:min(460px,100%);background:#151d19;border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.box h2{margin:0}.box p{color:var(--muted);font-size:12px;line-height:1.5}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:17px 0}.pick{height:70px;font-weight:1000}.pick.red{background:#df304b}.pick.yellow{background:#f0bd2a;color:#211902}.pick.green{background:#10bc70}.pick.blue{background:#377ff0}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);z-index:80;background:#f3f6f4;color:#07100c;border-radius:999px;padding:11px 16px;font-weight:1000;font-size:11px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1100px){.game{grid-template-columns:190px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){.top{height:64px;padding:0 12px}.screen{padding:12px 8px}.game{display:block;height:calc(100vh - 88px)}.side{display:none}.table{height:100%}.center{inset:60px 0 195px}.piles{gap:14px}.piles .card{transform:scale(.86)!important}.hand-area{left:8px;right:8px}.hand{justify-content:flex-start;padding-left:18px}.hand .card{flex-basis:72px;width:72px;height:106px;margin-left:-27px}.hand .main{font-size:22px}.hand .corner{font-size:9px}.row,.room{grid-template-columns:1fr}.lobby-card{padding:27px 20px}.hero h1{font-size:56px}.code{font-size:28px}}
</style></head><body><header class="top"><div class="brand"><div class="logo">UNO</div><div>UNO <small>Friends Table</small></div></div><button class="ghost" onclick="leave()">Leave</button></header><main id="app" class="screen"></main><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script>
const app=document.getElementById('app'),modal=document.getElementById('modal'),toastEl=document.getElementById('toast');let ws=null,state=null,log=[],name='',mode='create',selectedColor=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),2400)}
function connect(){if(ws)return;const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onopen=()=>{if(window.pending){ws.send(JSON.stringify(window.pending));window.pending=null}};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')return toast(m.message);if(m.type==='joined'||m.type==='state'||m.type==='lobby'){state=m.state;log=m.log||log;render()} };ws.onclose=()=>{ws=null;if(state)toast('Connection lost — refresh to reconnect')};ws.onerror=()=>toast('Could not connect to the game server')}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x));else{window.pending=x;connect()}}
function lobby(){app.innerHTML=`<section class="lobby"><div class="lobby-card"><div class="hero"><div class="eyebrow">Private multiplayer · 2–8 players</div><h1>UNO, but make it a <span>table.</span></h1><p>Create a private room, send the code to your friends, and play from separate devices. The server owns the deck and rules, so nobody has to trust a browser with the game.</p></div><div class="tabs"><button class="tab ${mode==='create'?'active':''}" onclick="mode='create';lobby()">Create room</button><button class="tab ${mode==='join'?'active':''}" onclick="mode='join';lobby()">Join room</button></div>${mode==='create'?`<div class="form"><input id="name" class="input" maxlength="18" placeholder="Your name" autocomplete="nickname"><button class="primary" onclick="create()">Create private table →</button></div>`:`<div class="form"><input id="name" class="input" maxlength="18" placeholder="Your name"><input id="room" class="input" maxlength="6" placeholder="ROOM CODE" style="text-transform:uppercase;letter-spacing:.16em"><button class="primary" onclick="join()">Join the table →</button></div>`}<p class="note">Classic UNO rules: 7 cards each · match color, number or symbol · Wild +4 can only be played without a matching color · UNO catches · Wild +4 challenge.</p></div></section>`}
function create(){name=(document.getElementById('name').value||'').trim();if(!name)return toast('Enter your name');send({type:'create',name})}
function join(){name=(document.getElementById('name').value||'').trim();const code=(document.getElementById('room').value||'').trim().toUpperCase();if(!name||code.length!==6)return toast('Enter your name and 6-character room code');send({type:'join',name,code})}
function render(){if(!state)return lobby();if(!state.started)return renderLobby();renderGame()}
function renderLobby(){const me=state.players.find(p=>p.id===state.me);const isHost=state.host===state.me;app.innerHTML=`<section class="lobby"><div class="lobby-card"><div class="eyebrow">Waiting room</div><h1 style="font-size:44px;letter-spacing:-.06em;margin:10px 0">Your table is ready.</h1><div class="room"><div class="mini"><h3>Room code</h3><div class="code">${esc(state.room)}</div><button class="ghost" onclick="navigator.clipboard.writeText(location.origin+'/?room='+state.room).then(()=>toast('Invite link copied'))">Copy invite link</button><p class="note">Send this code to your friends. They can join from any device.</p></div><div class="mini"><h3>Players · ${state.players.length}/8</h3><div class="players">${state.players.map(p=>`<div class="player"><div class="avatar">${esc(p.name[0]?.toUpperCase())}</div><b>${esc(p.name)}${p.id===state.me?' · you':''}</b><span class="tag ${p.ready?'ready':''}">${p.ready?'READY':'NOT READY'}</span></div>`).join('')}</div></div></div><div style="display:flex;gap:9px;margin-top:16px;flex-wrap:wrap">${!isHost?`<button class="primary" onclick="action('ready')">${me?.ready?'Set not ready':'Ready up ✓'}</button>`:`<button class="primary" onclick="action('start')">Start game →</button>`}<button class="ghost" onclick="leave()">Leave room</button></div><p class="note">${isHost?'Everyone must be ready before the host can start.':'Get ready when you are at the table. The host starts when everyone is ready.'}</p></div></section>`}
function card(c,click='',disabled=false){const cls=c.c==='wild'?'wild':c.c;const sym=c.n==='draw2'?'+2':c.n==='wild4'?'+4':c.n==='wild'?'W':c.n==='reverse'?'↻':c.n==='skip'?'⊘':c.n;return `<div class="card ${cls} ${disabled?'disabled':''}" ${click&&!disabled?`onclick="${click}"`:''}><span class="corner">${esc(sym)}</span><span class="main">${esc(sym)}</span><span class="corner">${esc(sym)}</span></div>`}
function legal(c){const top=state.discard;return c.c==='wild'||c.c===state.color||c.n===top.n}
function renderGame(){const me=state.players.find(p=>p.id===state.me);const myTurn=state.turn===state.me;const top=state.discard;const players=state.players;app.innerHTML=`<section class="game"><aside class="panel side"><div class="label">Players</div>${players.map(p=>`<div class="p ${p.id===state.turn?'active':''}"><div class="avatar">${esc(p.name[0]?.toUpperCase())}</div><b>${esc(p.name)}${p.id===state.me?' · you':''}</b><span class="count">${p.count}</span></div>`).join('')}</aside><section class="table"><div class="turn">${esc(players.find(p=>p.id===state.turn)?.name||'Player')}${myTurn?' · your turn':''}</div><div class="center"><div class="piles"><div><div class="caption">Draw · ${state.deckCount}</div><div class="stack"><div class="card" style="background:linear-gradient(145deg,#242b39,#0e121a);border-color:#70798a"><span class="main" style="color:#ff4165;font-size:25px">UNO</span></div></div></div><div><div class="caption">Discard</div><div class="stack">${card(top)}</div><div class="color"><span class="dot" style="background:${state.color}"></span>${state.color}</div></div></div></div><div class="hand-area"><div class="hand-head"><b>Your hand · ${me?.count??0}</b><span>${myTurn?'Play a card or draw.':'Watching '+esc(players.find(p=>p.id===state.turn)?.name||'the table')}</span></div><div class="hand">${(state.hand||[]).map((c,i)=>card(c,`play(${i})`,!myTurn||!legal(c))).join('')}</div><div class="actions"><button class="action primary" ${!myTurn?'disabled':''} onclick="draw()">Draw</button><button class="action" ${!myTurn||!me?.drew?'disabled':''} onclick="pass()">Pass</button><button class="action uno" onclick="uno()">UNO!</button>${state.pendingChallenge&&state.pendingChallenge.by!==state.me?`<button class="action" onclick="challenge()">Challenge +4</button>`:''}</div></div></section><aside class="panel right"><div class="label">Table feed</div><div class="feed">${log.map(x=>`<div class="event">${x.text}</div>`).join('')}</div><div class="stats"><div class="stat"><small>Players</small><b>${players.length}</b></div><div class="stat"><small>Deck</small><b>${state.deckCount}</b></div></div></aside></section>`}
function action(a){send({type:'action',action:a})}
function play(i){const c=state.hand[i];if(!c||state.turn!==state.me||!legal(c))return;if(c.c==='wild'){modal.innerHTML=`<div class="box"><h2>Choose a color</h2><p>Your Wild changes the current color for everyone.</p><div class="colors"><button class="pick red" onclick="closeColor('red')">RED</button><button class="pick yellow" onclick="closeColor('yellow')">YELLOW</button><button class="pick green" onclick="closeColor('green')">GREEN</button><button class="pick blue" onclick="closeColor('blue')">BLUE</button></div></div>`;modal.classList.remove('hidden');window.wildIndex=i}else send({type:'action',action:{a:'play',index:i}})}
function closeColor(c){modal.classList.add('hidden');send({type:'action',action:{a:'play',index:window.wildIndex,color:c}})}
function draw(){send({type:'action',action:{a:'draw'}})}function pass(){send({type:'action',action:{a:'pass'}})}function uno(){send({type:'action',action:{a:'uno'}})}function challenge(){send({type:'action',action:{a:'challenge'}})}
function leave(){if(ws){ws.close();ws=null}state=null;log=[];lobby()}lobby();
const params=new URLSearchParams(location.search);if(params.get('room')){mode='join';setTimeout(()=>{lobby();document.getElementById('room').value=params.get('room').toUpperCase()},0)}
</script></body></html>
