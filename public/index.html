nt:center;padding:0 24px;overflow-x:auto;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}.hand .card{position:relative;inset:auto;flex:0 0 79px;width:79px;height:116px;margin-left:-23px;cursor:pointer;transition:transform .22s var(--ease),filter .2s,box-shadow .2s;transform-origin:bottom center}.hand .card:first-child{margin-left:0}.hand .card:hover{transform:translateY(-24px) rotate(1deg)!important;z-index:20;filter:brightness(1.09);box-shadow:0 25px 38px #0007}.hand .card.disabled{filter:brightness(.47) grayscale(.4);cursor:not-allowed}.hand .card.disabled:hover{transform:none!important}.hand .main{font-size:25px}.hand .corner{font-size:10px}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.action:disabled{opacity:.3}.action.primary{background:#f5f7f6;color:#07100c}.uno{background:linear-gradient(135deg,#ff4168,#ff813f);box-shadow:0 9px 28px #ff355a35}.challenge{background:linear-gradient(135deg,#8d5cff,#e24cff);box-shadow:0 9px 28px #9a50ff35}.right{display:flex;flex-direction:column;min-height:0;padding:0}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid var(--line)}.chat-title{font-weight:1000;font-size:13px}.chat-sub{font-size:9px;color:#718078;margin-top:2px}.chat-body{flex:1;min-height:0;overflow:auto;padding:12px}.msg{display:flex;gap:8px;margin-bottom:11px;animation:msg .25s var(--ease)}@keyframes msg{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.msg .avatar{width:29px;height:29px;flex:0 0 29px}.bubble{min-width:0}.bubble b{font-size:9px;color:#aebbb4}.bubble span{display:block;margin-top:3px;padding:8px 10px;border-radius:12px 12px 12px 4px;background:#ffffff08;color:#e8eee9;font-size:11px;line-height:1.4;overflow-wrap:anywhere}.msg.mine{flex-direction:row-reverse}.msg.mine .bubble{text-align:right}.msg.mine .bubble span{background:#ff355a19;border:1px solid #ff355a25;border-radius:12px 12px 4px 12px}.typing{height:19px;padding:0 14px;co </style></head><body><header class="top"><div class="brand"><div class="logo">UNO</div><div>UNO <small>Friends Table</small></div></div><div class="top-actions"><button class="ghost" id="copyBtn" onclick="copyRoom()" style="display:none">Copy invite</button><button class="ghost" onclick="leave()">Leave</button></div></header><main id="app" class="screen"></main><div id="modal" class="modal hidden"></div><div id="toast" class="toast"></div><script>
const app=document.getElementById('app'),modal=document.getElementById('modal'),toastEl=document.getElementById('toast'),copyBtn=document.getElementById('copyBtn');
let ws=null,state=null,events=[],name='',mode=new URLSearchParams(location.search).has('room')?'join':'create',typingName='',typingTimer=0,lastDiscard='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=s=>esc(String(s||'?').trim().slice(0,1).toUpperCase());
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>toastEl.classList.remove('show'),2300)}
function connect(){if(ws)return;const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onopen=()=>{if(window.pending){ws.send(JSON.stringify(window.pending));window.pending=null}};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='error')return toast(m.message);if(m.type==='typing'){typingName=m.name;clearTimeout(typingTimer);typingTimer=setTimeout(()=>{typingName='';renderGame()},1300);return}if(m.type==='joined'||m.type==='state'||m.type==='lobby'||m.type==='chat'){state=m.state;events=m.log||events;document.body.dataset.room=state.room;copyBtn.style.display='inline-block';if(state.room)history.replaceState({},'',`?room=${state.room}`);render()}};ws.onclose=()=>{ws=null;if(state)toast('Connection lost — refresh to reconnect')};ws.onerror=()=>toast('Could not connect to the game server')}
function send(x){if(ws?.readyState===1)ws.send(JSON.stringify(x));else{window.pending=x;connect()}}
function leave(){try{ws?.close()}catch{}ws=null;state=null;events=[];copyBtn.style.display='none';history.replaceState({},'',location.pathname);lobby()}
async function copyRoom(){if(!state)return;const url=`${location.origin}${location.pathname}?room=${state.room}`;try{await navigator.clipboard.writeText(url);toast('Invite link copied')}catch{toast(`Room code: ${state.room}`)}}
function lobby(){app.innerHTML=`<section class="lobby"><div class="lobby-card"><div class="hero"><div class="eyebrow">Private multiplayer · 2–8 players</div><h1>UNO, but make it a <span>table.</span></h1><p>Create a private room, send one invite link to your friends, and play from separate devices. The server owns the deck, hands and rules so the table stays synchronized.</p></div><div class="tabs"><button class="tab ${mode==='create'?'active':''}" onclick="mode='create';lobby()">Create room</button><button class="tab ${mode==='join'?'active':''}" onclick="mode='join';lobby()">Join room</button></div>${mode==='create'?`<div class="form"><input id="name" class="input" maxlength="18" placeholder="Your name" autocomplete="nickname"><button class="primary" onclick="create()">Create private table →</button></div>`:`<div class="form"><input id="name" class="input" maxlength="18" placeholder="Your name" autocomplete="nickname"><input id="room" class="input" maxlength="6" value="${esc(new URLSearchParams(location.search).get('room')||'')}" placeholder="ROOM CODE" style="text-transform:uppercase;letter-spacing:.16em"><button class="primary" onclick="join()">Join the table →</button></div>`}<p class="note">Classic UNO: 7 cards · match color, number or symbol · Wild +4 only when you have no matching color · UNO calls and catches · Wild +4 challenges · live friend chat.</p></div></section>`}
function create(){name=(document.getElementById('name').value||'').trim();if(!name)return toast('Enter your name');send({type:'create',name})}
function join(){name=(document.getElementById('name').value||'').trim();const code=(document.getElementById('room').value||'').trim().toUpperCase();if(!name||code.length!==6)return toast('Enter your name and 6-character room code');send({type:'join',name,code})}
function render(){if(!state)return lobby();if(!state.started)return renderLobby();renderGame()}
function renderLobby(){const isHost=state.host===state.me;app.innerHTML=`<section class="lobby"><div class="lobby-card"><div class="eyebrow">Waiting room · ${state.players.length}/8</div><h1 style="font-size:44px;letter-spacing:-.065em;margin:10px 0">Your table is ready.</h1><div class="room"><div class="mini"><h3>Room code</h3><div class="code">${esc(state.room)}</div><button class="ghost" onclick="copyRoom()">Copy invite link</button><p class="note">Send the invite to your friends. They can join from any device.</p></div><div class="mini"><h3>Players</h3><div class="players">${state.players.map(p=>`<div class="player"><div class="avatar">${initials(p.name)}</div><b>${esc(p.name)} ${p.id===state.me?'(you)':''}${p.id===state.host?'<span class="host">HOST</span>':''}</b><span class="tag">${p.ready?'<span class="ready">READY</span>':'Not ready'}</span></div>`).join('')}</div></div></div><div style="display:flex;gap:9px;margin-top:15px;flex-wrap:wrap"><button class="action ${isHost?'primary':''}" onclick="send({type:'action',action:'ready'})">${state.players.find(p=>p.id===state.me)?.ready?'Ready ✓':'Ready up'}</button>${isHost?`<button class="primary" onclick="send({type:'action',action:'start'})" ${state.players.length<2||!state.players.every(p=>p.ready)?'disabled':''}>Start game →</button>`:''}</div><p class="note" style="margin-top:13px">${isHost?'Everyone must be ready before the host can start.':'Toggle Ready when you are set. The host will start the round.'}</p></div></section>`}
function card(c,small=false,disabled=false,index=-1,extra=''){if(!c)return '';const cls=`card ${c.c} ${small?'small':''} ${disabled?'disabled':''} ${extra}`;const text=c.n==='wild4'?'+4':c.n==='wild'?'WILD':c.n==='skip'?'⊘':c.n==='reverse'?'↻':c.n==='draw2'?'+2':c.n;return `<div class="${cls}" ${index>=0?`onclick="playCard(${index})"`:''}><span class="corner">${esc(text)}</span><span class="main">${esc(text)}</span><span class="corner r">${esc(text)}</span></div>`}
function renderGame(){
  const me=state.players.find(p=>p.id===state.me),myTurn=state.turn===state.me,challenge=state.pendingChallenge&&myTurn;
  const hand=state.hand||[],top=state.discard,can=(c)=>c.c==='wild'||c.c===state.color||c.n===top.n;
  const justPlayed=top?.u&&top.u!==lastDiscard;lastDiscard=top?.u||'';
  const chat=state.chat||[];
  app.innerHTML=`<section class="game"><aside class="panel side"><div class="label">Players</div>${state.players.map(p=>`<div class="p ${state.turn===p.id?'active':''} ${p.id===state.me?'me':''}"><div class="avatar">${initials(p.name)}</div><div style="min-width:0"><b style="display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}${p.id===state.host?'<span class="host">HOST</span>':''}</b><span style="font-size:8px;color:#728078">${p.ready?'ready':'waiting'} · ${p.connected?'online':'offline'}</span></div><span class="count">${p.count}</span></div>`).join('')}</aside><div class="table"><div class="turn ${myTurn?'my pulse':''}">${myTurn?'Your turn':'Waiting for '+esc(state.players.find(p=>p.id===state.turn)?.name||'player')} · ${state.direction===1?'↻':'↺'}</div><div class="center"><div><div class="piles"><div class="pile-wrap"><div class="caption">Draw pile</div><div class="stack"><div class="card back blue"><span class="main">UNO</span></div><div class="card blue top deal"><span class="main">UNO</span></div></div><div class="colorline">${state.deckCount} cards left</div></div><div class="pile-wrap"><div class="caption">Discard</div><div class="stack">${card(top,false,false,-1,justPlayed?'played':'top')}</div><div class="colorline"><span class="dot ${state.color}"></span>${state.color}</div></div></div>${challenge?`<div style="display:flex;gap:8px;justify-content:center;margin-top:18px"><button class="action challenge" onclick="send({type:'action',action:{a:'challenge'}})">Challenge +4</button><button class="action primary" onclick="send({type:'action',action:{a:'draw4'}})">Take +4</button></div>`:''}</div></div><div class="hand-area"><div class="hand-head"><b>${esc(me?.name||'Your')} · ${hand.length} cards</b><span>${myTurn?'Make your move':'Waiting for the table'}</span></div><div class="hand">${hand.map((c,i)=>card(c,false,!(myTurn&&can(c)&&!state.pendingChallenge),i,'deal')).join('')}</div><div class="actions"><button class="action primary" ${!myTurn||state.pendingChallenge?'disabled':''} onclick="send({type:'action',action:{a:'draw'}})">Draw card</button><button class="action" ${!myTurn||!me?.drew?'disabled':''} onclick="send({type:'action',action:{a:'pass'}})">Pass</button><button class="action uno" ${hand.length!==1?'disabled':''} onclick="send({type:'action',action:{a:'uno'}})">UNO!</button><button class="action" onclick="send({type:'action',action:{a:'catch'}})">Catch</button></div></div></div><aside class="panel right"><div class="chat-head"><div><div class="chat-title">Table chat</div><div class="chat-sub">${state.players.length} players · live</div></div><span style="font-size:16px">💬</span></div><div class="chat-body" id="chatBody">${chat.length?chat.map(m=>`<div class="msg ${m.player===state.me?'mine':''}"><div class="avatar">${initials(m.name)}</div><div class="bubble"><b>${esc(m.name)}</b><span>${esc(m.text)}</span></div></div>`).join(''):`<div style="text-align:center;color:#617069;font-size:10px;padding:28px 8px">No messages yet.<br>Start the table banter.</div>`}</div><div class="typing">${typingName?esc(typingName)+' is typing…':''}</div><div class="chat-form"><input id="chatInput" class="chat-input" maxlength="180" placeholder="Say something…" oninput="typing()" onkeydown="if(event.key==='Enter'){event.preventDefault();sendChat()}"><button class="send" onclick="sendChat()">↑</button></div><div class="feed">${events.slice(0,20).map(e=>`<div class="event">${esc(e.text)}</div>`).join('')}</div><div class="stats"><div class="stat"><small>Cards</small><b>${state.deckCount}</b></div><div class="stat"><small>Direction</small><b>${state.direction===1?'↻':'↺'}</b></div></div></aside></section>`;
  requestAnimationFrame(()=>{const c=document.getElementById('chatBody');if(c)c.scrollTop=c.scrollHeight});
  if(state.winner)showWinner();
}
function typing(){send({type:'action',action:{a:'typing'}})}
function sendChat(){const el=document.getElementById('chatInput');const text=(el?.value||'').trim();if(!text)return;send({type:'action',action:{a:'chat',text}});el.value='';el.focus()}
function playCard(i){if(!state||state.turn!==state.me)return;const c=state.hand[i];if(!c)return;if(c.c==='wild'){modal.classList.remove('hidden');modal.innerHTML=`<div class="box"><h2>Choose your color</h2><p>Pick the color the next player must match.</p><div class="colors"><button class="pick red" onclick="choose('red')">RED</button><button class="pick yellow" onclick="choose('yellow')">YELLOW</button><button class="pick green" onclick="choose('green')">GREEN</button><button class="pick blue" onclick="choose('blue')">BLUE</button></div><button class="ghost" style="width:100%" onclick="closeModal()">Cancel</button></div>`}else send({type:'action',action:{a:'play',index:i}})}
function choose(color){closeModal();const i=state.hand.findIndex(c=>c.u===state.hand.find(c=>c.c==='wild')?.u);send({type:'action',action:{a:'play',index:i,color}})}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
function showWinner(){const p=state.players.find(x=>x.id===state.winner);if(document.querySelector('.winner'))return;const box=document.createElement('div');box.className='winner';box.innerHTML=`<div class="box"><div class="trophy">🏆</div><div class="eyebrow">Round complete</div><h2 style="font-size:34px;margin:8px 0">${esc(p?.name||'Someone')} wins!</h2><p>${esc(state.message||'')}</p><button class="primary" onclick="send({type:'action',action:'newround'});document.querySelector('.winner')?.remove()">New round</button></div>`;document.body.appendChild(box)}
if(new URLSearchParams(location.search).has('room'))mode='join';lobby();
</script></body></html>
